services:
  postgres:
    image: 'postgres'
    restart: always
    ports: 
      - '5434:5432'
    volumes:
      - data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ./env/postgres.env
  backend:
    build: 
      context: ./
      dockerfile: ./backend/Dockerfile
    ports: 
      - '8010:8010'
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    volumes:
      - frontend_build:/frontend/build
  nginx:
    image: nginx:latest
    ports:
      - 80:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/var/www/html
    depends_on:
      - backend
      - frontend
      - postgres

volumes:
  data:
  frontend_build: